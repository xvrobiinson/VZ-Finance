[package]
name = "vz-finance"
version = "0.1.0"
edition = "2024"
description = "VZ Finance: a private, offline lending portfolio manager for Windows"
license = "Proprietary"
publish = false

[lib]
name = "vz_finance"
path = "src/lib.rs"

[[bin]]
name = "vz-finance"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
csv = "1.4.0"
dirs = "7.0.0"
env_logger = "0.11.11"
gpui-kit = "0.8.0"
log = "0.4.34"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
