[package]
name = "acervus"
version = "0.9.0"
edition = "2024"
description = "Acervus Finance by VZ Labs: a private lending portfolio manager for Windows"
license = "Proprietary"
publish = false

[lib]
name = "acervus"
path = "src/lib.rs"

[[bin]]
name = "acervus"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
chrono = "0.4.45"
csv = "1.4.0"
dirs = "7.0.0"
env_logger = "0.11.11"
gpui-kit = "0.8.0"
# Same version GPUI already builds; used to shrink an uploaded logo.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
log = "0.4.34"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
thiserror = "2.0.21"
# Both already built for GPUI. Used by the Windows file window (file_picker.rs).
raw-window-handle = "0.6.2"
# Cloud sync (src/sync): the official Convex client on its own Tokio runtime,
# and a small blocking HTTPS client for the sign-in endpoints. Both use the
# Windows TLS stack (native-tls).
convex = "0.10.4"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync", "macros"] }
ureq = { version = "3.5.0", default-features = false, features = ["native-tls", "json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    # Sync: the session in Credential Manager, ID photos encrypted with DPAPI.
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"
# Test windows for the forms (GPUI test platform).
gpui-pre = { version = "=0.3.9", features = ["test-support"] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
